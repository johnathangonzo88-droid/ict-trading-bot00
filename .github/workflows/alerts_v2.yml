name: ICT Liquidity Sweep Alerts v2 (24h, ES + NQ, fixed strategy)

on:
  schedule:
    # Runs every 15 minutes, 24/7 -- the study found killzone-only scheduling
    # (the old */15 5-10 and */15 12-17 windows) left too few trades per
    # month to validate. This is a real cost trade-off: 24/7 at 15-min
    # intervals is roughly 4x the GitHub Actions minutes of the old
    # two-window schedule. If you're on a free private-repo minutes budget,
    # either move this to a self-hosted runner or accept fewer checks/day
    # (e.g. "*/30 * * * *") -- just know that widens the gap between a
    # signal firing and this workflow noticing it.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ICT v2 alert check (24h, ES + NQ)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_alert_bot_ict_v2.py \
            --tickers ES=F,NQ=F \
            --once \
            --state-file ict_alert_state_v2.json \
            --telegram-token "$TELEGRAM_TOKEN" \
            --telegram-chat-id "$TELEGRAM_CHAT_ID"

      - name: Save alert state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ict_alert_state_v2.json
          git diff --cached --quiet || git commit -m "Update ICT v2 alert state [skip ci]"
          git pull --rebase origin main
          git push
