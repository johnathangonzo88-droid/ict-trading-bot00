name: ICT Liquidity Sweep Alerts

on:
  schedule:
    - cron: "*/15 5-10 * * 1-5"   # covers London killzone (~02:00-05:00 ET) across DST
    - cron: "*/15 12-17 * * 1-5"  # covers NY killzone (~08:30-11:00 ET) across DST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ICT alert check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_alert_bot_ict.py \
            --tickers MES=F,MNQ=F \
            --once \
            --session-start 02:00 \
            --session-end 05:00 \
            --state-file ict_alert_state_london.json \
            --telegram-token "$TELEGRAM_TOKEN" \
            --telegram-chat-id "$TELEGRAM_CHAT_ID"
          python live_alert_bot_ict.py \
            --tickers MES=F,MNQ=F \
            --once \
            --session-start 08:30 \
            --session-end 11:00 \
            --state-file ict_alert_state_ny.json \
            --telegram-token "$TELEGRAM_TOKEN" \
            --telegram-chat-id "$TELEGRAM_CHAT_ID"

      - name: Save alert state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ict_alert_state_london.json ict_alert_state_ny.json
          git diff --cached --quiet || git commit -m "Update ICT alert state [skip ci]"
          git pull --rebase origin main
          git push
